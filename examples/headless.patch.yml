# Headless starts without a Web agent preset. Mount the same leader module and
# worker tools at the host layer for this dedicated one-task process.
- insert:
    - id: collab-leader-headless
      name: dsh-harness-collab
    - id: collab-codex-headless
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: collab-codex
        toolName: subagent_codex
        maxDepth: provider-managed

# Use the saved Harness credential through its normal resolver.
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false

- id: preset-collab-leader
  disabled: true
